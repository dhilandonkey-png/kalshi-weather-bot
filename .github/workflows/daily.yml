name: daily run

# Every morning: settle yesterday's markets, paper-trade today's and tomorrow's,
# and commit the updated state.json and REPORT.md so the track record builds up in git.
on:
  schedule:
    - cron: "17 14 * * *" # 10:17 ET (14:17 UTC during daylight time)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew run
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json REPORT.md
          git diff --cached --quiet || git commit -m "Daily run $(date -u +%Y-%m-%d)"
          git push
